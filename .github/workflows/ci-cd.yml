name: Build and push docker images and deploy to EC2

on:
  push:
    branches: ["cex-v3"]

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: client
            image: amitesh252/cex-client
          - service: http
            image: amitesh252/cex-http
          - service: ws
            image: amitesh252/cex-ws
          - service: engine
            image: amitesh252/cex-engine
          - service: db-worker
            image: amitesh252/cex-db-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ..
          file: ops/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}

